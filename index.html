<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#000000" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Daily Tracker" />
<title>Daily Tracker</title>
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icons/icon-192.png" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<link rel="stylesheet" href="./css/style.css" />
</head>
<body>
<div id="app">
  <div class="screen" id="screen-home"></div>
  <div class="screen" id="screen-menu" hidden></div>
  <div class="screen" id="screen-library" hidden></div>
  <div class="screen" id="screen-report" hidden></div>

  <div id="toast-wrap" class="toast-wrap"></div>
  <div id="modal-overlay" class="modal-overlay"></div>
</div>
<script type="module" src="./js/app.js"></script>
</body>
</html>
